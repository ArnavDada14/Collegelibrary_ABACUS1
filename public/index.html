<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-logo">📚 Library</h1>
        <p class="auth-subtitle">Management System</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
          <div class="form-error hidden" id="loginEmailError"></div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
          <div class="form-error hidden" id="loginPasswordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
          <span id="loginBtnText">Sign In</span>
          <span class="spinner hidden" id="loginSpinner"></span>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" name="name" placeholder="Enter your full name" required>
          <div class="form-error hidden" id="registerNameError"></div>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" placeholder="Enter your email" required>
          <div class="form-error hidden" id="registerEmailError"></div>
        </div>

        <div class="form-group">
          <label for="registerStudentId">Student ID</label>
          <input type="text" id="registerStudentId" name="studentId" placeholder="Enter your student ID" required>
          <div class="form-error hidden" id="registerStudentIdError"></div>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" name="password" placeholder="Minimum 6 characters" required>
          <div class="form-error hidden" id="registerPasswordError"></div>
        </div>

        <div class="form-group">
          <label for="registerConfirmPassword">Confirm Password</label>
          <input type="password" id="registerConfirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
          <div class="form-error hidden" id="registerConfirmPasswordError"></div>
        </div>

        <div class="form-group">
          <label for="registerRole">Role</label>
          <select id="registerRole" name="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
          <div class="form-error hidden" id="registerRoleError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerSubmitBtn">
          <span id="registerBtnText">Create Account</span>
          <span class="spinner hidden" id="registerSpinner"></span>
        </button>
      </form>

      <!-- TOGGLE BETWEEN LOGIN AND REGISTER -->
      <div class="auth-toggle">
        <p id="toggleText">Don't have an account? 
          <button type="button" id="toggleBtn">Register here</button>
        </p>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer"></div>

  <!-- LOADING OVERLAY -->
  <div class="spinner-full" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
